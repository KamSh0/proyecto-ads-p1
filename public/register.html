<!DOCTYPE html>

<html lang="es">
    <head>
        <title>Tienda UPB - Registar Usuario</title>
        <meta charset="UTF-8">
        <meta name="description" content="Registro Cliente - Tienda UPB">
        <link rel="stylesheet" href="./styles.css">
    </head>

    <body>
        <div class="container-top-bar">
            <a href="index.html"> < Volver</a>
            <h2>Registro Cliente Nuevo</h2>
        </div>
        <div class="main-body">
            <form id="registerForm">
                <input type="text" id="nombre" placeholder="Nombre">
                <input type="text" id="apellidos" placeholder="Apellidos">
                <input type="text" id="cedula" placeholder="Cédula de Ciudadanía">
                <input type="text" id="email" placeholder="Correo Electrónico" required>
                <input type="password" id="password" placeholder="Contraseña" required>
                <button type="submit">Registrarse</button>
            </form>
            <script type="module" src="./frontendUserRegister.js"></script>

        </div>
        <footer>
            <h4 id="register-response"></h4>
        </footer>
    </body>
</html>
